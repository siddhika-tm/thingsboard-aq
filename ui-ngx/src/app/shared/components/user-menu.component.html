<button #menuButton #menuPopoverFull="tbPopover" mat-button class="tb-user-menu" [class.tb-collapsed]="collapsed"
        (click)="$event.stopPropagation();"
        tb-popover
        tbPopoverTrigger="click"
        [tbPopoverMenu]="true"
        [tbPopoverContent]="userMenuTpl"
        [tbPopoverOverlayClassName]="collapsed ? 'tb-user-menu-collapsed' : ''"
        [tbPopoverPlacement]="collapsed ? 'right' : 'topLeft'">
  <!-- AIRLINQ: initials avatar (AC-16/AC-23). Interpolated, so it is escaped - ADR 0002. -->
  <div class="tb-user-avatar" aria-hidden="true">{{ userInitials$ | async }}</div>
  <div class="tb-user-info">
    @if (userDisplayName$ | async; as userDisplayName) {
      <span class="tb-user-display-name">{{ userDisplayName }}</span>
    }
    @if (authorityName$ | async; as authorityName) {
      <span class="tb-user-authority">{{ authorityName | translate }}</span>
    }
  </div>
  <!-- AIRLINQ: overflow affordance (AC-18). Decorative: the whole block is already the
       popover trigger, so a nested button would add a second tab stop for one action. -->
  <tb-icon class="material-icons tb-user-overflow" aria-hidden="true">more_vert</tb-icon>
</button>
<button #menuPopoverIcon="tbPopover" mat-icon-button class="tb-user-menu-icon"
        (click)="$event.stopPropagation();"
        tb-popover
        tbPopoverTrigger="click"
        [tbPopoverMenu]="true"
        [tbPopoverContent]="userMenuTpl"
        [tbPopoverPlacement]="'bottomRight'">
  <tb-icon class="material-icons tb-mini-avatar">mdi:account-circle-outline</tb-icon>
</button>
<ng-template #userMenuTpl>
  @if (authority$ | async; as authority) {
    <div class="tb-menu-content tb-user-menu-items" [style.width.px]="!collapsed ? menuButton?._elementRef?.nativeElement?.offsetWidth : ''">
      <div class="tb-user-email">
        {{ userEmail$ | async }}
      </div>
      <button mat-button (click)="menuPopoverFull?.hide(); menuPopoverIcon?.hide(); openAccount()">
        <tb-icon matButtonIcon>mdi:account-circle-outline</tb-icon>
        <span translate>account.account</span>
      </button>
      <button mat-button (click)="toggleTheme()">
        <tb-icon matButtonIcon>{{ (isDark$ | async) ? 'light_mode' : 'dark_mode' }}</tb-icon>
        <span>{{ ((isDark$ | async) ? 'theme.switch-to-light' : 'theme.switch-to-dark') | translate }}</span>
      </button>
      <button mat-button class="tb-logout" (click)="menuPopoverFull?.hide(); menuPopoverIcon?.hide(); logout()">
        <tb-icon matButtonIcon>logout</tb-icon>
        <span translate>home.logout</span>
      </button>
    </div>
  }
</ng-template>
