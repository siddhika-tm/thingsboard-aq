<ul class="tb-side-menu flex flex-col items-stretch justify-start" [class.tb-collapsed]="collapsed">
  @for (section of menuSections$ | async; track section.id) {
    <li>
      @switch (section.type) {
        @case ('link') {
          <tb-menu-link [section]="section" [collapsed]="collapsed"
                        [badgeCount]="section.badge === 'alarmCount' ? (alarmCount$ | async) : null"></tb-menu-link>
        }
        @case ('toggle') {
          <!-- AIRLINQ (AC-47): forward the count so a badged CHILD row (D4 moved
               `alarms` under the `alarms_center` toggle) still gets its badge.
               tb-side-menu stays the single subscription owner. -->
          <tb-menu-toggle [section]="section" [collapsed]="collapsed"
                          [alarmCount]="alarmCount$ | async"></tb-menu-toggle>
        }
        @case ('divider') {
          <mat-divider></mat-divider>
        }
        <!-- AIRLINQ: non-interactive section heading (Option A sectioned menu). -->
        @case ('section') {
          <div class="tb-menu-section" role="presentation">
            {{ section.customTranslate ? (section.name | customTranslate) : (section.name | translate) }}
          </div>
        }
      }
    </li>
  }
</ul>
